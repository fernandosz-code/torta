<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torta</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      font-family: Arial, sans-serif;

      /* Fondo */
      background-image: url("fondo.jpg");
      background-size: auto 100%;
      background-position: center;
      background-repeat: no-repeat;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-align: center;
      background: rgba(255, 255, 255, 0.75);
      padding: 40px;
      border-radius: 20px;
    }

    .fila-principal {
      display: flex;
      gap: 15px;
    }

    button {
      font-size: 24px;
      padding: 20px 40px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background-color: #091250;
      color: white;
    }

    .fila-principal button {
      white-space: nowrap;
    }

    button:hover {
      background-color: #F27444;
    }

    .boton-cancionero {
      margin-top: 15px;
      padding: 18px 40px;
      font-size: 22px;
    }

    @media (max-width: 420px) {
      .container { padding: 24px 20px; }
      button { padding: 16px 20px; font-size: 20px; }
      .boton-cancionero { padding: 13px 20px; font-size: 18px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="fila-principal">
      <button onclick="playSound('sonido1')">Torta</button>
      <button onclick="playSound('sonido2')">Mas Torta</button>
    </div>
    <button type="button" class="boton-cancionero" onclick="window.location.href='canciones.html'">Canciones de Torta</button>
  </div>

  <audio id="sonido1" src="sonido1.m4a"></audio>
  <audio id="sonido2" src="sonido2.m4a"></audio>

  <script>
    function playSound(id) {
      const audio = document.getElementById(id);
      audio.currentTime = 0;
      audio.play();
    }
  </script>
</body>
</html>
